[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "service-desk-insights"
version = "0.1.0"
description = "Local, reproducible service-desk reporting from anonymised ticket exports"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Eric Jay" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Office/Business",
]
dependencies = [
  "jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8.3,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
service-desk-insights = "service_desk_insights.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/service_desk_insights"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "SIM", "T20", "UP"]